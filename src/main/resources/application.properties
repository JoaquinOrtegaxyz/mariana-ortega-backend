server.port=${PORT:8080}

# Conexion a PostgreSQL (Local en Docker o vía variables en producción)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inmobiliaria?options=-c%20TimeZone=America/Argentina/Buenos_Aires}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Compresion HTTP Gzip
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Configuracion de Hibernate & Batching
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Configuracion de Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dflypdlq3}
cloudinary.api-key=${CLOUDINARY_API_KEY:443135366248531}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:TGLU8P6VEPUFFY3kjbofrgHUrPY}

# Configuracion de JWT
jwt.secret=${JWT_SECRET:U3VwZXJTZWNyZXRLZXlQYXJhTGEyMDI0SW5tb2JpbGlhcmlhRGVNYXJpYW5hT3J0ZWdhMTIzNDU=}

# Limite de subida de archivos (permite PNGs y fotos de alta resolución)
